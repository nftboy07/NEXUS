name: CI

# Runs every acceptance command from AGENTS.md. No secrets, no paid services.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TS ${{ matrix.workspace }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        workspace:
          - services/evm_listener
          - services/mempool_listener
          - services/dex_monitor
          - packages/shared_utils
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: typecheck
        working-directory: ${{ matrix.workspace }}
        run: npm run typecheck
      - name: test
        working-directory: ${{ matrix.workspace }}
        run: npm test

  python:
    name: Py ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service:
          - services/wallet_intelligence
          - services/mev_analyzer
          - services/ai_investigator
          - services/alert_dispatcher
          - apps/api
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.service }}/requirements.txt
      - name: venv + requirements
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt
      - name: pytest
        run: .venv/bin/python -m pytest

  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/dashboard
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint -- --max-warnings=0
      - run: npm run typecheck
      - run: npm test

  migrations:
    name: Migrations (fresh Postgres 16)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus
          POSTGRES_DB: nexus
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nexus -d nexus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: nexus
      PGPASSWORD: nexus
      PGDATABASE: nexus
    steps:
      - uses: actions/checkout@v5
      - name: apply 001..N twice (order + idempotency)
        run: bash scripts/ci_migrations.sh
