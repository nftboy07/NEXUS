name: Smoke (live, manual)

# Manual (workflow_dispatch, once on main) or by adding the `smoke` label to a
# PR. Brings up the full Docker Compose stack against free
# publicnode RPCs and runs scripts/smoke.sh. No secrets; EXECUTION stays off.
on:
  pull_request:
    types: [labeled]
  push:
    branches: [devin/1795176092-ci]
  workflow_dispatch:
    inputs:
      eth_wss:
        description: Ethereum WSS RPC (free public endpoint)
        default: wss://ethereum-rpc.publicnode.com
      eth_http:
        description: Ethereum HTTP RPC
        default: https://ethereum.publicnode.com
      base_wss:
        description: Base WSS RPC
        default: wss://base-rpc.publicnode.com
      base_http:
        description: Base HTTP RPC
        default: https://base-rpc.publicnode.com

permissions:
  contents: read

jobs:
  smoke:
    if: github.event_name != 'pull_request' || github.event.label.name == 'smoke'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: write .env
        env:
          ETH_WSS: ${{ inputs.eth_wss || 'wss://ethereum-rpc.publicnode.com' }}
          ETH_HTTP: ${{ inputs.eth_http || 'https://ethereum.publicnode.com' }}
          BASE_WSS: ${{ inputs.base_wss || 'wss://base-rpc.publicnode.com' }}
          BASE_HTTP: ${{ inputs.base_http || 'https://base-rpc.publicnode.com' }}
        run: |
          cp .env.example .env
          set_env() { grep -q "^$1=" .env && sed -i "s|^$1=.*|$1=$2|" .env || echo "$1=$2" >> .env; }
          set_env WSS_RPC_URL "$ETH_WSS"
          set_env HTTP_RPC_URL "$ETH_HTTP"
          set_env WSS_RPC_URL_BASE "$BASE_WSS"
          set_env HTTP_RPC_URL_BASE "$BASE_HTTP"
          set_env NEXUS_API_KEY smoke-key
          set_env EXECUTION_ENABLED false
      - name: pre-pull base images (mirror fallback on Docker Hub 429)
        run: |
          for img in postgres:16 redis:7 node:22-alpine node:22-slim python:3.12-slim; do
            docker pull "$img" || { docker pull "mirror.gcr.io/library/$img" && docker tag "mirror.gcr.io/library/$img" "$img"; }
          done
      - name: smoke.sh
        run: bash scripts/smoke.sh
      - name: compose logs
        if: always()
        run: docker compose logs --no-color --tail=200
      - name: teardown
        if: always()
        run: docker compose down -v
