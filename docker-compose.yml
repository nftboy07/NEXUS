services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus
      POSTGRES_DB: nexus
    ports: ["5432:5432"]
    volumes:
      - nexus_pg:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
  redis:
    image: redis:7
    ports: ["6379:6379"]
  api:
    build: ./apps/api
    environment:
      DATABASE_URL: postgresql://nexus:nexus@postgres:5432/nexus
      REDIS_URL: redis://redis:6379
    ports: ["8000:8000"]
    depends_on: [postgres, redis]
  evm_listener:
    build:
      context: .
      dockerfile: services/evm_listener/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://nexus:nexus@postgres:5432/nexus
      REDIS_URL: redis://redis:6379
    depends_on: [postgres, redis]
    restart: unless-stopped

  mempool_listener:
    build:
      context: .
      dockerfile: services/mempool_listener/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://nexus:nexus@postgres:5432/nexus
      REDIS_URL: redis://redis:6379
    depends_on: [postgres, redis]
    restart: unless-stopped
volumes:
  nexus_pg:

  dashboard:
    build: ./apps/dashboard
    environment:
      - NEXUS_API_URL=http://api:8000
      - NEXUS_API_KEY=${NEXUS_API_KEY}
    ports:
      - "3000:3000"
    depends_on:
      - api
