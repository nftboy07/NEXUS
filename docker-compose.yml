services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus
      POSTGRES_DB: nexus
    ports: ["5432:5432"]
    volumes:
      - nexus_pg:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
  redis:
    image: redis:7
    ports: ["6379:6379"]

  evm_listener:
    build:
      context: .
      dockerfile: services/evm_listener/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://nexus:nexus@postgres:5432/nexus
      REDIS_URL: redis://redis:6379
    depends_on: [postgres, redis]
    restart: unless-stopped

  mempool_listener:
    build:
      context: .
      dockerfile: services/mempool_listener/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://nexus:nexus@postgres:5432/nexus
      REDIS_URL: redis://redis:6379
    depends_on: [postgres, redis]
    restart: unless-stopped

  dex_monitor:
    build:
      context: .
      dockerfile: services/dex_monitor/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://nexus:nexus@postgres:5432/nexus
      REDIS_URL: redis://redis:6379
    depends_on: [postgres, redis]
    restart: unless-stopped

  wallet_intelligence:
    build: ./services/wallet_intelligence
    env_file: .env
    environment:
      DATABASE_URL: postgresql://nexus:nexus@postgres:5432/nexus
      REDIS_URL: redis://redis:6379
    depends_on: [postgres, redis]
    restart: unless-stopped

  alert_dispatcher:
    build: ./services/alert_dispatcher
    env_file: .env
    environment:
      DATABASE_URL: postgresql://nexus:nexus@postgres:5432/nexus
      REDIS_URL: redis://redis:6379
    depends_on: [postgres, redis]
    restart: unless-stopped

  ai_investigator:
    build: ./services/ai_investigator
    env_file: .env
    environment:
      DATABASE_URL: postgresql://nexus:nexus@postgres:5432/nexus
      REDIS_URL: redis://redis:6379
    depends_on: [postgres, redis]
    restart: unless-stopped
    command: ["python", "src/main.py", "--worker"]

  api:
    build: ./apps/api
    env_file: .env
    environment:
      DATABASE_URL: postgresql://nexus:nexus@postgres:5432/nexus
      REDIS_URL: redis://redis:6379
    ports: ["8000:8000"]
    depends_on: [postgres, redis]
    restart: unless-stopped

  dashboard:
    build: ./apps/dashboard
    environment:
      - NEXUS_API_URL=http://api:8000
      - NEXUS_API_KEY=${NEXUS_API_KEY}
    ports: ["3000:3000"]
    depends_on: [api]

# Batch/CLI services intentionally run on demand, not as daemons:
#   mev_analyzer (batch cursor over stored data) and ai_investigator
#   ai_investigator CLI use (it also runs as a --worker compose service
#   above) — see services/*/README.md.

volumes:
  nexus_pg:
